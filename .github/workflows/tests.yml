name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install runtime-test dependencies
        run: Rscript -e 'install.packages(c("C50", "randomForest"), repos="https://cloud.r-project.org")'
      - name: Run provenance, core, and model smoke tests
        run: Rscript tests/test_core.R
